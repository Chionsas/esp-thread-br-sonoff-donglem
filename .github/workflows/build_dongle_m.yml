name: Build Sonoff Dongle-M OTBR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/donglem-network-led

jobs:
  build:
    name: Build Dongle-M firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Dongle-M firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router
          idf.py -B build-sonoff-dongle-m \
            -D SDKCONFIG=sdkconfig.sonoff_dongle_m \
            -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.sonoff_dongle_m \
            build

      - name: Create merged flash image
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python3 tools/release/merge_dongle_m_image.py \
            examples/basic_thread_border_router/build-sonoff-dongle-m \
            --output artifacts/sonoff-dongle-m-otbr-ci.bin

      - name: Show firmware checksums
        shell: bash
        run: |
          ls -lh artifacts/sonoff-dongle-m-otbr-ci.bin*
          cat artifacts/sonoff-dongle-m-otbr-ci.bin.sha256

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: |
            artifacts/sonoff-dongle-m-otbr-ci.bin
            artifacts/sonoff-dongle-m-otbr-ci.bin.sha256
          if-no-files-found: error
          retention-days: 14
